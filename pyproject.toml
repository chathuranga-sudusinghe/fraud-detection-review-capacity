[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-review-capacity"
version = "0.1.0"
description = "MSc Data Science research project on fraud detection under limited review capacity."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "jupyter",
    "ipykernel",
]

[project.optional-dependencies]
ml = [
    "lightgbm",
    "catboost",
]

# PyTorch for the neural models. The RTX 50-series GPU (compute capability 12.0)
# needs a CUDA 12.8 build: install torch from https://download.pytorch.org/whl/cu128
# before this group (see GitHub Issue #50).
dl = [
    "torch>=2.7",
]

dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = []