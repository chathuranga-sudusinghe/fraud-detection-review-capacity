[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-review-capacity"
version = "0.1.0"
description = "MSc Data Science research project on fraud detection under limited review capacity."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "pyyaml",
    "jupyter",
    "ipykernel",
]

[project.scripts]
review-capacity = "review_capacity.cli:main"

[project.optional-dependencies]
ml = [
    "lightgbm",
    "catboost",
]

# PyTorch for the neural models. The RTX 50-series GPU (compute capability 12.0)
# needs a CUDA 12.8 build: install torch from https://download.pytorch.org/whl/cu128
# before this group (see GitHub Issue #50).
dl = [
    "torch>=2.7",
]

dev = [
    "pytest",
    "ruff",
    "mypy",
    "pandas-stubs",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["–", "−", "×"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "tests"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "integration: tests on the local raw data (skipped when data/raw/ is absent)",
]