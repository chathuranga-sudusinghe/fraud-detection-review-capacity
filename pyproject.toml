[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-review-capacity"
version = "0.1.0"
description = "MSc Data Science research project on fraud detection under limited review capacity."
requires-python = ">=3.12"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyarrow",
    "jupyter",
    "ipykernel",
]

[project.optional-dependencies]
ml = [
    "lightgbm",
    "catboost",
]

dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = []