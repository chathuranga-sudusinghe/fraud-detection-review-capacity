[build-system]
requires = ["setuptools==78.1.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-review-capacity"
version = "0.1.0"
description = "MSc Data Science research project on fraud detection under limited review capacity."
requires-python = ">=3.12,<3.13"

# Every direct dependency is pinned to the version that produced the project's evidence
# (Issue #60). Application dependencies, including indirect dependencies, are locked in uv.lock.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "jupyter==1.1.1",
    "ipykernel==7.3.0",
]

[project.scripts]
review-capacity = "review_capacity.cli:main"

[project.optional-dependencies]
ml = [
    "lightgbm==4.7.0",
    "catboost==1.2.10",
]

# PyTorch for the neural models. The RTX 50-series GPU (compute capability 12.0) needs the
# CUDA 12.8 build, taken from the PyTorch index below (see GitHub Issue #50).
dl = [
    "torch==2.11.0",
]

dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "types-PyYAML==6.0.12.20260906",
]

[tool.uv]
# The study runs on Linux x86-64 (WSL2); the lock covers that platform only, where the
# CUDA 12.8 PyTorch build exists.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Constrains the isolated build environments. This project: setuptools and wheel are pinned in
# [build-system]; packaging is the remaining build dependency (required by wheel). LightGBM's
# CUDA source build (below): scikit-build-core and its dependencies, CMake and Ninja.
build-constraint-dependencies = [
    "cmake==4.4.4",
    "ninja==1.13.2",
    "packaging==26.3",
    "pathspec==1.1.1",
    "scikit-build-core==1.1.1",
]
# Indirect dependencies held at the versions installed in the environment that produced the
# project's evidence (Issue #60); without these, uv would resolve them to the newest versions.
constraint-dependencies = [
    "charset-normalizer==3.5.1",
    "cuda-bindings==12.9.7",
    "cuda-pathfinder==1.6.0",
    "executing==2.2.1",
    "filelock==3.32.3",
    "fonttools==4.65.0",
    "fqdn==1.5.1",
    "fsspec==2026.7.0",
    "iniconfig==2.3.0",
    "json5==0.15.0",
    "jsonpointer==3.1.1",
    "markupsafe==3.0.3",
    "narwhals==2.26.0",
    "nest-asyncio2==1.7.3",
    "networkx==3.6.1",
    "platformdirs==4.11.12",
    "pycparser==3.0",
    "rpds-py==2026.6.3",
    "setuptools==78.1.0",
    "soupsieve==2.9.2",
    "tzdata==2026.4",
    "wcwidth==0.8.4",
]
# LightGBM's CUDA implementation is not in the standard wheel (REF-116): it is built from source
# for the project GPU (compute capability sm_120) with the CUDA 12.8 Toolkit and NCCL 2.26.2,
# both installed on the system as described in docs/environment-setup.md (DR-013 §2).
no-binary-package = ["lightgbm"]

[tool.uv.config-settings-package.lightgbm]
"cmake.define.USE_CUDA" = "ON"
"cmake.define.CMAKE_CUDA_ARCHITECTURES" = "120"
"cmake.define.CMAKE_CUDA_COMPILER" = "/usr/local/cuda-12.8/bin/nvcc"
# Require these executable versions during normal discovery and disable automatic
# fallback from Ninja to Make. Build constraints apply when the Python packages
# are requested; matching system executables may be used (DR-013 §2).
"cmake.version" = "==4.4.4"
"ninja.version" = "==1.13.2"
"ninja.make-fallback" = "false"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", extra = "dl" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# scripts/: gpu_feasibility_probe.py is kept exactly as it ran to produce the committed evidence in
# evidence/gpu_probe/; Issue #66 replaces it with a package command under these rules.
extend-exclude = ["notebooks", "scripts"]

[tool.ruff.lint]
# T20: no print (the package logs; see review_capacity.logging_setup); LOG, G: logging usage;
# BLE: no broad except unless it re-raises.
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF",
    "T20", "LOG", "G", "C4", "RET", "PIE", "PT", "N", "ARG", "PERF", "PTH", "BLE",
]
allowed-confusables = ["–", "−", "×"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "tests"
strict = true

[[tool.mypy.overrides]]
# Libraries without type information (no py.typed marker or stubs).
module = [
    "pyarrow", "pyarrow.*", "catboost", "catboost.*", "sklearn", "sklearn.*", "scipy", "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "integration: checks on the processed development files (opt-in: REVIEW_CAPACITY_INTEGRATION=1)",
]