derived:
  # DR-008 §4: row-local, label-free, computed before TransactionDT is dropped; numeric role for every model.
  source_column: TransactionDT
  validation: "stop with an error if any TransactionDT is missing, non-finite or not a whole number of seconds, or its relative day (TransactionDT // 86400) lies outside 1-182; no row is dropped or imputed"
  angle: "theta = 360 degrees * (TransactionDT mod 86400) / 86400 (continuous time-of-day angle within the relative day, 0 <= theta < 360 degrees; not local clock time). In radians, as used by code: theta_rad = 2 * pi * (TransactionDT mod 86400) / 86400"
  numeric:
    - name: tod_sin
      rule: "sin(theta) = sin(theta_rad)"
    - name: tod_cos
      rule: "cos(theta) = cos(theta_rad)"

encoding:
  categorical_canonical_form:
    # One canonical representation, built identically for all models before any model-specific step.
    value_type: string
    numeric_codes: "integer-valued codes rendered without a decimal part (e.g. 100.0 -> '100', 1000 -> '1000')"
    string_values: "kept exactly as in the raw data (no case folding, trimming, merging or grouping)"
    missing_token: "__MISSING__"
  numeric:
    dtype: float64
    applies_to: "the 382 numeric columns and the 2 derived inputs (384 numeric inputs)"
    missing: "NaN in the canonical frame; handled natively by the tree-based libraries (no imputation, scaling, clipping or transformation); neural representation below"
  lightgbm:
    categorical_dtype: "pandas Categorical; category list = canonical values observed in Train only, reused unchanged for V1, V2 and Test"
    categorical_feature: "the 49 categorical columns above, by name"
    unseen_categories: "values absent from the Train category list become NaN and are treated as missing by LightGBM"
    numeric_missing: "library default (use_missing = true, zero_as_missing = false)"
  catboost:
    cat_features: "the 49 categorical columns above, by name, as canonical strings"
    unseen_categories: "handled natively by CatBoost"
    numeric_missing: "library default nan_mode = Min"
  neural:
    # docs/decisions/DR-012-neural-network-input-representation.md: PROPOSED for the design review (GitHub Issue #56); identical for ResNet-style MLP and FT-Transformer.
    # Rules apply by input role (categorical / numeric), including any input added later through an approved Issue.
    status: proposed
    categorical: "per-input vocabulary of canonical labels observed in Train only; __MISSING__ reserved in every vocabulary; values unseen in Train map to the __MISSING__ index (missing and unseen share one index); learned embeddings in the model"
    category_dropout: "training only: each categorical value replaced by __MISSING__ with probability 0.01 (fixed, not tuned), independently per value and epoch, from the declared training seed; none when scoring"
    numeric_transform: "quantile transformation to a normal output distribution, fitted per numeric input (including the derived inputs) on its non-missing Train values, n_quantiles = max(min(n_Train // 30, 1000), 10) = 1000 (n_Train = number of Train rows), no subsampling; Gaussian noise with std 1e-3 / max(s_i, 1e-3) (s_i = population std, ddof = 0, of the non-missing Train values of input i) added to every non-missing Train value for fitting only; transformation applied to the original values; values outside the fitted range (of the noise-perturbed Train values) map to the output bounds (REF-087 Appendix B.2; noise and quantiles from reference implementation REF-103, pinned commit, adapted: no Train-mean filling before fitting)"
    noise_seed: "one fixed seed, independent of the model-training seeds, so the fitted transformation is identical for all neural configurations; value fixed in the training rules"
    constant_inputs: "no special rule: s_i = 0 gives noise std 1"
    all_missing_inputs: "stop with an error (none among the declared inputs)"
    numeric_missing: "0 after the transformation, plus one binary missingness indicator per numeric input with at least one missing Train value (324 indicators; 757 neural inputs)"
    fitting: "vocabularies, transformations and indicator list fitted on Train only, stored with each model, applied unchanged to Validation 1, Validation 2 and Test"
