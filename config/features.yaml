# Model-input feature declaration for the IEEE-CIS Fraud Detection study.
# Decision record: docs/decisions/DR-008-feature-declaration-and-model-input-policy.md (GitHub Issue #23).
# Human-readable per-column meanings, dtypes, missingness and cautions: docs/feature-catalog.md.
#
# Source: train_transaction.csv LEFT JOIN train_identity.csv ON TransactionID
#         (394 + 41 - 1 shared key = 434 joined columns).
# Every joined column appears in exactly one of: target, excluded, categorical, numeric.
# Two derived numeric inputs (time of day, DR-008 §4) are declared separately under `derived`; the joined schema is unchanged.
# All four models (LightGBM, CatBoost, ResNet-style MLP, FT-Transformer; DR-011) receive the SAME 433 inputs
# (431 joined columns + 2 derived) and the SAME 49 categorical columns. Family-specific representations are declared under `encoding`.
# This file declares roles only. It contains no data values and no fitted statistics.

version: 1
source:
  join: "train_transaction LEFT JOIN train_identity ON TransactionID (one-to-one)"
  joined_column_count: 434
  model_input_column_count: 431
  derived_input_count: 2
  model_input_count: 433

target: isFraud

excluded:
  - name: TransactionID
    reason: "Row identifier; monotone in time (Spearman |rho| = 1 with TransactionDT), i.e. a disguised timestamp."
  - name: TransactionDT
    reason: "Raw time offset in seconds; used to derive relative days, the temporal split and the two derived time-of-day inputs; never a model input itself."

